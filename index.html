<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://script.google.com/macros/s/AKfycbw0SubTP2aXPnNwbFN8QZh6_zpu2OMcsSHzesoh_md3Nn5XDrCNlVUoKdd_C8DL0Ges1A/exec">
    <title>PERMIC 2026 V1.0 - Redireccionando</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        .icon-container {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            position: relative;
        }

        .icon-container svg {
            width: 45px;
            height: 45px;
            fill: #ffffff;
        }

        .badge-registered {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-registered svg {
            width: 14px;
            height: 14px;
            fill: #2ecc71;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .system-name {
            color: #00d2ff;
            display: block;
            font-size: 1.4rem;
            margin-top: 4px;
        }

        p {
            font-size: 0.95rem;
            color: #d1d8e0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Spinner de carga */
        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #00d2ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
            filter: brightness(1.1);
        }

        /* Animaciones */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
        </div>

        <div class="badge-registered">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            Sistema Registrado ®
        </div>

        <h1>
            ¡Bienvenido al Sistema Académico!
            <span class="system-name">PERMIC 2026 V1.0</span>
        </h1>

        <p>Redirigiendo a la plataforma oficial en unos segundos...</p>

        <div class="loader"></div>

        <a href="https://script.google.com/macros/s/AKfycbw0SubTP2aXPnNwbFN8QZh6_zpu2OMcsSHzesoh_md3Nn5XDrCNlVUoKdd_C8DL0Ges1A/exec" class="btn">
            Ingresar Directamente
        </a>
    </div>

</body>
</html>
