    <style>
        /* Estilos base garantizados */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0f2027;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 25px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .badge {
            display: inline-block;
            background: #2ecc71;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .system-title {
            color: #00d2ff;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        p {
            color: #d1d8e0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background: #00d2ff;
            color: #0f2027;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
